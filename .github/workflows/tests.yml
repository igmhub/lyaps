name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Bug-catching checks only; --isolated so no config can change what CI enforces.
      - name: Lint
        run: ruff check lyaps bin --isolated --select E9,F63,F7,F82 --extend-exclude lyaps/fft1d/old_functions.py

  import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      # No test suite yet: check that the package and its modules import.
      - name: Import check
        run: python -c "import lyaps, lyaps.main, lyaps.config, lyaps.io, lyaps.deltas, lyaps.fourier, lyaps.fft1d.averaging; print(lyaps.__version__)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
